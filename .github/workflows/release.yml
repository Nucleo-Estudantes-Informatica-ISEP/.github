name: Reusable Release

on:
  workflow_call:
    inputs:
      product_name:
        description: Human-readable product name used in GitHub Release titles.
        required: true
        type: string
      edition_label:
        description: >-
          Optional edition label inserted into the release title as
          "<product_name> <edition_label> — <tag>" (e.g. "2026 Edition").
          Leave unset for a plain "<product_name> <tag>" title.
        required: false
        type: string
        default: ""

jobs:
  validate-release-label:
    name: Release policy
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: Nucleo-Estudantes-Informatica-ISEP/.github/.github/actions/release-policy@master
        with:
          github-token: ${{ github.token }}

  publish-release:
    name: Publish release
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: Nucleo-Estudantes-Informatica-ISEP/.github/.github/actions/release-publish@master
        with:
          github-token: ${{ github.token }}
          product-name: ${{ inputs.product_name }}
          edition-label: ${{ inputs.edition_label }}
